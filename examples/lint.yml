# Lint Lua files on pushes and pull requests.
name: Lint
on:
  push:
    paths: ["**.lua", ".github/workflows/lint.yml", "qbxlint.toml"]
  pull_request:
    paths: ["**.lua", ".github/workflows/lint.yml", "qbxlint.toml"]

jobs:
  lint:
    name: Lint Lua
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: Qbox-project/qbx-lua@v1.1.0
